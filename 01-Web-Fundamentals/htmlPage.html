<!DOCTYPE html>
<html lang="en">
  <head>
    <title>City Services</title>
    <style>  h1 {color: red;}</style>
  </head>
  <body>
    <header>Nikolay Avramov</header>
    <main>
      <h1>My Requests</h1>
      <form>
        <label tabindex="1" for="title">Title</label>
        <input tabindex="5" id="title" name="title" required>

        <label tabindex="2" for="category">Category</label>
        <select id="category">
          <option>Roads</option>
          <option>Lighting</option>
        </select>
        <textarea tabindex="3" id="description" name="description" placeholder="Describe your request" required></textarea>
        <button tabindex="4" type="submit">Next</button>
        
      </form>
  </body>
</html>
